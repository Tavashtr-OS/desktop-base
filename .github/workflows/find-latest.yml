name: Latest Trixie Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *' # Runs at 2:30 AM UTC (8:00 AM IST) every day

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    env:
      PACKAGE: desktop-base

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Debian source tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                      devscripts \
                      debian-keyring \
                      git-buildpackage \
                      pristine-tar

      - name: Resolve latest Debian Trixie source
        id: source
        run: |
          BEST_VER=""
          BEST_URL=""
          BEST_SUITE=""

          for SUITE in trixie trixie-updates trixie-security; do
              if [ "$SUITE" = "trixie-security" ]; then
                  ROOT="https://deb.debian.org/debian-security"
              else
                  ROOT="https://deb.debian.org/debian"
              fi
              INDEX="${ROOT}/dists/${SUITE}/main/source/Sources.xz"

              echo "Scanning $SUITE..."

              # Download to disk to explicitly capture HTTP codes and network crashes
              INDEX_FILE="$RUNNER_TEMP/Sources.xz"
              if ! HTTP_CODE="$(curl \
                  --silent --show-error --location \
                  --connect-timeout 20 \
                  --max-time 120 \
                  --retry 3 \
                  --output "$INDEX_FILE" \
                  --write-out '%{http_code}' \
                  "$INDEX")"; then
                echo "::error::Network error downloading $SUITE."
                exit 1
              fi

              if [[ "$HTTP_CODE" == "404" ]]; then
                echo "Index for $SUITE not found. Skipping."
                continue
              elif [[ "$HTTP_CODE" != "200" ]]; then
                echo "::error::Unexpected HTTP status $HTTP_CODE for $SUITE."
                exit 1
              fi

              # Parse from local disk. AWK can now safely use early 'exit' with zero pipe errors!
              DATA=$(xzcat "$INDEX_FILE" | awk -v pkg="$PACKAGE" '
                  $1 == "Package:" { in_pkg = ($2 == pkg) }
                  in_pkg && $1 == "Version:" { ver = $2 }
                  in_pkg && $1 == "Directory:" { dir = $2 }
                  in_pkg && $3 ~ /\.dsc$/ { dsc = $3 }
                  /^$/ && in_pkg { print ver, dir, dsc; found=1; exit }
                  END { if (!found && in_pkg && ver && dir && dsc) print ver, dir, dsc }
              ')

              if [ -n "$DATA" ]; then
                  VER=$(echo "$DATA" | awk '{print $1}')
                  DIR=$(echo "$DATA" | awk '{print $2}')
                  DSC=$(echo "$DATA" | awk '{print $3}')
                  FULL_URL="${ROOT}/${DIR}/${DSC}"

                  if [ -z "$BEST_VER" ] || dpkg --compare-versions "$VER" gt "$BEST_VER"; then
                      BEST_VER="$VER"
                      BEST_URL="$FULL_URL"
                      BEST_SUITE="$SUITE"
                  fi
              fi
          done

          if [ -z "$BEST_VER" ]; then
              echo "Error: $PACKAGE not found in Trixie indexes."
              exit 1
          fi

          echo "Selected version: $BEST_VER"
          echo "Selected suite: $BEST_SUITE"
          echo "DSC URL: $BEST_URL"

          echo "version=$BEST_VER" >> "$GITHUB_OUTPUT"
          echo "suite=$BEST_SUITE" >> "$GITHUB_OUTPUT"
          echo "dsc_url=$BEST_URL" >> "$GITHUB_OUTPUT"

      - name: Check whether Debian source is newer
        id: version_check
        env:
          NEW_VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail

          git fetch origin --tags \
            +refs/heads/debian-trixie:refs/remotes/origin/debian-trixie

          # Force local branch to match remote
          git switch -C debian-trixie origin/debian-trixie

          CURRENT_VERSION=$(dpkg-parsechangelog -S Version)

          echo "Existing changelog version: $CURRENT_VERSION"
          echo "New Debian source version: $NEW_VERSION"

          if dpkg --compare-versions "$NEW_VERSION" gt "$CURRENT_VERSION"; then
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "A newer Debian source version is available."
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "No newer Debian source version. Skipping import."
          fi

      - name: Download exact Debian source with dget
        if: steps.version_check.outputs.update == 'true'
        run: |
          mkdir -p ../debian-source
          cd ../debian-source

          dget -d "${{ steps.source.outputs.dsc_url }}"

          ls -lh

      - name: Check and Update Debian base
        if: steps.version_check.outputs.update == 'true'
        run: |
          # Configure Git for the import commits
          git config user.name "Tavashtr Sync Bot"
          git config user.email "githubci@tavashtr.com"
          git switch debian-trixie

          gbp import-dsc \
            --debian-branch=debian-trixie \
            --pristine-tar \
            ../debian-source/*.dsc

          echo "Updated local branch:"
          git log -1 --oneline
          git status --short --branch

          # Push the new commits AND the new version tags back to GitHub
          git push origin debian-trixie --tags
